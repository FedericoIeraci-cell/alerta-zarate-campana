name: Alerta Zarate Campana - validar datos y portada

on:
  push:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'ubicacion_local_frontend/**'
      - '.github/workflows/zc-validacion.yml'
  pull_request:
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'tests/**'
      - 'ubicacion_local_frontend/**'
      - '.github/workflows/zc-validacion.yml'

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verificar ubicación con coordenadas sintéticas, sin permisos reales
        run: node tests/test_ubicacion_js.cjs
      - name: Verificar datos, vigencias e interacciones sin red
        run: |
          python -m py_compile app.py hidrometria_local.py red_integrada.py portada_zc.py ubicacion_local.py
          python -m unittest discover -s tests -v
