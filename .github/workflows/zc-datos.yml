name: Zarate Campana - actualizar datos independientes

on:
  schedule:
    - cron: '5,15,25,35,45,55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zc-datos-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_monitor.txt
      - run: python -m pip install -r requirements_monitor.txt
      - name: Actualizar y confirmar datos locales
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONUNBUFFERED: '1'
          TZ: America/Argentina/Buenos_Aires
        run: python publicar_datos_zc.py --publicar
